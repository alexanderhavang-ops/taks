# Optional nginx reverse proxy (place on TAK host).
# Replace "48hvbat-private-ip" with the LLM host private IP or DNS name.
#
# Exposes (on the TAK host):
#   http://<tak-host>/llm/health  ->  http://<llm-host>:8090/health
#
# Keep INTERNAL (SG/VPC), do not expose publicly without auth.

upstream llm_backend {
  server 48hvbat-private-ip:8090;
  keepalive 16;
}

server {
  listen 80;
  server_name _;

  location /llm/ {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    proxy_pass http://llm_backend/;
  }
}

