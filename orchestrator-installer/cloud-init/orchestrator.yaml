#cloud-config
package_update: true
package_upgrade: false

write_files:
  - path: /etc/tak-orch/install.env
    permissions: "0640"
    owner: root:root
    content: |
      FQDN=master.tak-hv-sandbox.se
      LE_EMAIL=admin@tak-hv-sandbox.se

  - path: /usr/local/sbin/orch-install
    permissions: "0755"
    owner: root:root
    content: |
      #!/usr/bin/env bash
      set -euo pipefail
      
      ENV_FILE="${ENV_FILE:-/etc/tak-orch/install.env}"
      
      log(){ echo "[$(date -Is)] $*"; }
      die(){ echo "ERROR: $*" >&2; exit 1; }
      
      require_root(){ [[ $EUID -eq 0 ]] || die "must run as root"; }
      
      load_env(){
        [[ -f "$ENV_FILE" ]] || die "missing env file: $ENV_FILE"
        # shellcheck disable=SC1090
        source "$ENV_FILE"
        : "${FQDN:?}" "${LE_EMAIL:?}"
      }
      
      pkg_install(){
        export DEBIAN_FRONTEND=noninteractive
        apt-get update -y
        apt-get install -y \
          git awscli jq dnsutils \
          nginx certbot python3-certbot-nginx \
          ca-certificates curl unzip
        systemctl enable --now nginx
      }
      
      nginx_quarantine_conflicts(){
        local se="/etc/nginx/sites-enabled"
        local q="/etc/nginx/sites-disabled-quarantine"
        mkdir -p "$se" "$q"
      
        shopt -s nullglob
        for f in "$se"/*; do
          [[ -f "$f" || -L "$f" ]] || continue
          # If it references our FQDN or listens on 80/443, quarantine it.
          if grep -Eq "server_name\s+${FQDN}\b|listen\s+80\b|listen\s+443\b|default_server" "$f" 2>/dev/null; then
            log "Quarantining enabled vhost: $f"
            mv -f "$f" "$q/$(basename "$f").$(date +%Y%m%d-%H%M%S)"
          fi
        done
        shopt -u nullglob
      }
      
      write_nginx_canonical(){
        local sa="/etc/nginx/sites-available"
        local se="/etc/nginx/sites-enabled"
        local name="orch-master"
        local conf="${sa}/${name}.conf"
        mkdir -p "$sa" "$se"
      
        local tmp; tmp="$(mktemp)"
        cat >"$tmp" <<CONF
      # Canonical orchestrator vhost for ${FQDN}
      # 80  : ACME only + redirect to 443
      # 443 : UI/API (reverse proxy will be added later)
      
      server {
        listen 80;
        server_name ${FQDN};
      
        location /.well-known/acme-challenge/ {
          root /var/www/html;
          try_files \$uri =404;
        }
      
        location / {
          return 301 https://\$host\$request_uri;
        }
      }
      
      server {
        listen 443 ssl http2;
        server_name ${FQDN};
      
        ssl_certificate     /etc/letsencrypt/live/${FQDN}/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/${FQDN}/privkey.pem;
      
        # Placeholder until API/UI is wired in:
        location / {
          return 200 "orchestrator: nginx up (API/UI pending)\n";
          add_header Content-Type text/plain;
        }
      }
      CONF
      
        if [[ -f "$conf" ]] && cmp -s "$tmp" "$conf"; then
          rm -f "$tmp"
          log "NGINX canonical config unchanged."
        else
          if [[ -f "$conf" ]]; then
            mkdir -p /etc/nginx/backup
            cp -a "$conf" "/etc/nginx/backup/$(basename "$conf").bak.$(date +%Y%m%d-%H%M%S)"
          fi
          mv -f "$tmp" "$conf"
          log "Wrote NGINX canonical config: $conf"
        fi
      
        ln -sf "$conf" "$se/${name}.conf"
      }
      
      ensure_webroot(){
        mkdir -p /var/www/html/.well-known/acme-challenge
        chown -R www-data:www-data /var/www/html
      }
      
      le_cert_obtain(){
        # If cert exists, skip
        if [[ -f "/etc/letsencrypt/live/${FQDN}/fullchain.pem" ]]; then
          log "LE cert already present for ${FQDN}"
          return 0
        fi
      
        # nginx must be up + valid before certbot
        nginx -t || die "nginx config invalid before certbot"
        systemctl reload nginx
      
        log "Requesting LE cert for ${FQDN}"
        certbot certonly --nginx \
          -d "${FQDN}" \
          --non-interactive --agree-tos \
          -m "${LE_EMAIL}" || die "certbot failed (DNS/SG/80 reachability?)"
      }
      
      nginx_reload_safe(){
        nginx -t || die "nginx config invalid"
        systemctl reload nginx
      }
      
      plan(){
        require_root
        load_env
        log "Plan for ${FQDN}: install pkgs, canonical nginx vhost, obtain LE cert, safe reload."
      }
      
      apply(){
        require_root
        load_env
        pkg_install
        ensure_webroot
        nginx_quarantine_conflicts
        write_nginx_canonical
        # First reload with placeholder cert paths may fail if cert isn't present yet.
        # So: obtain cert first (certbot uses nginx plugin with port 80).
        le_cert_obtain
        nginx_reload_safe
        log "DONE: nginx + LE ready for ${FQDN}"
      }
      
      verify(){
        require_root
        load_env
        systemctl is-active --quiet nginx || die "nginx not active"
        [[ -f "/etc/letsencrypt/live/${FQDN}/fullchain.pem" ]] || die "LE cert missing for ${FQDN}"
        curl -skI "https://${FQDN}/" | head -n 5
        log "OK: ${FQDN} responds on 443 with LE cert present"
      }
      
      case "${1:-}" in
        plan) plan ;;
        apply) apply ;;
        verify) verify ;;
        *) echo "usage: orch-install {plan|apply|verify}" ; exit 2 ;;
      esac
runcmd:
  - |
    set -eux
    install -d -m 0755 /opt/tak-orch/{logs,bin} /etc/tak-orch
    /usr/local/sbin/orch-install apply | tee /opt/tak-orch/logs/cloud-init-install.log
    /usr/local/sbin/orch-install verify | tee -a /opt/tak-orch/logs/cloud-init-install.log
