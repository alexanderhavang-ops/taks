server {
    access_log /var/log/nginx/enroll-debug.log enroll_dbg;
    error_log  /var/log/nginx/enroll-error.log info;

    listen 8446 ssl;
    server_name __FQDN__;

    ssl_certificate     /etc/letsencrypt/live/__FQDN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__FQDN__/privkey.pem;

    include /etc/nginx/snippets/ssl-common.conf;
    include /etc/nginx/snippets/deny-dotfiles.conf;

    # Upstream (TAK internal web listener). Often self-signed.
    proxy_ssl_verify off;
    proxy_ssl_server_name on;

    # --- WebSocket support ---
    # WebTAK uses a websocket for live CoT / server push.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # "Boring" frontdoor: proxy EVERYTHING to TAK upstream.
    location / {
        proxy_pass https://127.0.0.1:8447;

        proxy_http_version 1.1;
        proxy_buffering off;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port  8446;

        # WebSocket headers (critical for CoT live connection)
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # WebSockets need long timeouts
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
    }
}
