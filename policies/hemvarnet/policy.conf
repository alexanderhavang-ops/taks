; TAKS Policy Pack: Hemvärnet (starter)
; Purpose: provide defaults for onboarding identity (callsign + team color)
; Notes:
; - This is a DEFAULTS policy. Users may override per-user/per-device.
; - Keep schema stable; add new keys/sections instead of changing meaning.

[meta]
id = hemvarnet
name = Hemvärnet (Sweden Home Guard) - starter
version = 0.1
status = draft

; -----------------------------------------------------------------------------
; Callsign policy
; -----------------------------------------------------------------------------
[callsign]
; Allowed characters / normalization hints (enforced later)
normalize_upper = true
strip_spaces = true

; Template vocabulary (resolved later by code):
; {unit} = unit callsign (e.g. BSFB)
; {n}    = number/index (e.g. 1,2,3)
; {role_suffix} = role-specific suffix, if any
;
; Examples from HV-like practice:
; - platoon callsign + role: BSFB1 (chef)
; - platoon callsign + number: BSFB2 (stf/indiv)
template_default = {group_callsign}{n}

; Role suffix rules (optional)
role_suffix_none = ""
role_suffix_leader = ""     ; HV often encodes leader as “...1” rather than suffix
role_suffix_deputy = ""     ; reserved
role_suffix_signals = ""    ; reserved

; -----------------------------------------------------------------------------
; Team color policy (ATAK locationTeam)
; -----------------------------------------------------------------------------
[team.defaults]
; If nothing matches:
team = Blue

; “Battalion staff / ledning”
[team.battalion]
staff = Black
command = Black

; Company standard colors (starter set — extend over time)
[team.company]
1 = White
2 = Orange
3 = Pink
4 = GrayBlue

; Platoon standard colors (starter set — extend over time)
; NOTE: if you later want “within-company platoon mapping”, add sections like:
; [team.platoon.company2] 1=Orange 2=Blue ...
[team.platoon]
1 = Green
2 = Blue
3 = Yellow
4 = Red

; -----------------------------------------------------------------------------
; Role defaults (optional now; used later)
; -----------------------------------------------------------------------------
[role.defaults]
; Suggested mapping to ATAK role types (used later if we want)
leader = Team Lead
member = Team Member
staff  = HQ

[fal.hvbat]
46 = VQ
47 = VV
48 = VW
