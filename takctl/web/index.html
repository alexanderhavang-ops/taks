<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>takctl</title>

  <link rel="stylesheet" href="./styles.css" />

  <style>
    :root{
      --bg:#0b1020;
      --fg:rgba(255,255,255,.92);
      --muted:rgba(255,255,255,.65);
      --panel:rgba(255,255,255,.07);
      --line:rgba(255,255,255,.12);
      --accent:#38bdf8;
      --danger:#f87171;
      --radius:18px;
      --shadow:0 20px 60px rgba(0,0,0,.45);
      --sans:ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial;
      --mono:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;
    }

    html,body{height:100%}
    body{
      margin:0;
      font-family:var(--sans);
      color:var(--fg);
      background:
        radial-gradient(1200px 700px at 20% 10%, rgba(56,189,248,.22), transparent 55%),
        radial-gradient(900px 600px at 80% 20%, rgba(34,197,94,.18), transparent 60%),
        var(--bg);
    }

    #root{height:100%}

    /* ---- splash ---- */

    #__splash{
      position:fixed;
      inset:0;
      z-index:9999;
      display:none;
    }

    .splash{
      min-height:100vh;
      display:flex;
      flex-direction:column;
      justify-content:center;
      gap:36px;
      padding:48px 96px;
    }

    .splash-slogan{
      text-align:center;
      font-size:28px;
      font-weight:800;
      letter-spacing:.2px;
      opacity:.95;
    }

    .splash-main{
      display:flex;
      justify-content:center;
      align-items:center;
      gap:96px;
    }

    .splash-taks img{
      height:280px;
      filter:drop-shadow(0 18px 48px rgba(0,0,0,.4));
    }

    .splash-stack{
      display:flex;
      flex-direction:column;
      gap:32px;
    }

    .splash-stack img{
      height:130px;
      filter:drop-shadow(0 14px 36px rgba(0,0,0,.35));
    }

    .login-wrap{
      display:flex;
      justify-content:center;
    }

    .login{
      width:min(960px,calc(100vw - 40px));
      background:linear-gradient(180deg,rgba(255,255,255,.09),var(--panel));
      border:1px solid var(--line);
      border-radius:var(--radius);
      box-shadow:var(--shadow);
      padding:22px 24px 18px;
    }

    .login h1{
      margin:0;
      font-size:18px;
      font-weight:800;
    }

    .login p{
      margin:4px 0 0;
      font-size:13px;
      color:var(--muted);
      font-weight:600;
    }

    .login-row{
      margin-top:16px;
      display:flex;
      gap:16px;
      align-items:flex-end;
      flex-wrap:wrap;
    }

    .field{
      flex:1;
      min-width:220px;
      display:flex;
      flex-direction:column;
      gap:6px;
    }

    .field label{
      font-size:12px;
      font-weight:700;
      color:var(--muted);
    }

    .field input{
      height:44px;
      border-radius:12px;
      border:1px solid var(--line);
      background:rgba(0,0,0,.25);
      color:var(--fg);
      padding:0 12px;
      font-size:14px;
    }

    .field input:focus{
      outline:none;
      border-color:rgba(56,189,248,.6);
      box-shadow:0 0 0 4px rgba(56,189,248,.15);
    }

    .login button{
      height:44px;
      padding:0 18px;
      border-radius:12px;
      border:1px solid rgba(56,189,248,.45);
      background:rgba(56,189,248,.22);
      color:var(--fg);
      font-weight:800;
      cursor:pointer;
    }

    .login button:hover{
      background:rgba(56,189,248,.3);
    }

    .login-error{
      display:none;
      margin-top:10px;
      color:var(--danger);
      font-weight:700;
      font-size:13px;
    }

    .login-foot{
      margin-top:10px;
      font-size:11px;
      color:var(--muted);
      font-family:var(--mono);
    }
  </style>
</head>

<body>
  <div id="__splash"></div>
  <div id="root"></div>

  <script src="./vendor/react.production.min.js"></script>
  <script src="./vendor/react-dom.production.min.js"></script>

  <script src="./hooks/useApi.js"></script>
  <script src="./components/Layout.js"></script>
  <script src="./components/UsersView.js"></script>
  <script src="./components/ClientsView.js"></script>
  <script src="./components/CRLView.js"></script>
  <script src="./components/CertsView.js"></script>
  <script src="./app.js"></script>

  <script>
  (function(){
    window.__takctl_brand = {};

    async function loadMeta(){
      try{
        const r = await fetch("./api/meta",{cache:"no-store"});
        if(!r.ok) return;
        const j = await r.json();
        window.__takctl_brand = (j && (j.brand || j)) || {};
        const s = document.getElementById("__splash_slogan");
        if(s) s.textContent = window.__takctl_brand.slogan || "";
        if(window.__takctl_brand.title){
          document.title = window.__takctl_brand.title;
        }
      }catch(_){}
    }

    function showSplash(msg){
      const root = document.getElementById("__splash");
      root.style.display="block";

      root.innerHTML = `
        <div class="splash">
          <div class="splash-slogan" id="__splash_slogan"></div>

          <div class="splash-main">
            <div class="splash-taks">
              <img src="./assets/taks-logo.png" alt="TAKS">
            </div>
            <div class="splash-stack">
              <img src="./assets/logo1.png">
              <img src="./assets/logo2.svg">
              <img src="./assets/logo3.png">
            </div>
          </div>

          <div class="login-wrap">
            <div class="login">
              <h1>takctl</h1>
              <p>${msg||""}</p>

              <div class="login-row">
                <div class="field">
                  <label>Username</label>
                  <input id="__login_user" autocomplete="username">
                </div>
                <div class="field">
                  <label>Password</label>
                  <input id="__login_pass" type="password" autocomplete="current-password">
                </div>
                <button id="__login_btn">Sign in</button>
              </div>

              <div class="login-error" id="__login_err"></div>
              <div class="login-foot">/takctl/</div>
            </div>
          </div>
        </div>
      `;

      loadMeta();

      const u=document.getElementById("__login_user");
      const p=document.getElementById("__login_pass");
      const e=document.getElementById("__login_err");

      async function post(body){
        const r=await fetch("./api/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
        const t=await r.text();
        let j; try{j=JSON.parse(t)}catch(_){}
        if(!r.ok) throw new Error(j?.detail||t);
      }

      async function login(){
        e.style.display="none";
        if(!u.value||!p.value){
          e.textContent="Missing username or password.";
          e.style.display="block";
          return;
        }
        try{
          await post({username:u.value,password:p.value});
          location.reload();
        }catch(err){
          e.textContent=String(err.message||err);
          e.style.display="block";
        }
      }

      document.getElementById("__login_btn").onclick=login;
      u.onkeydown=p.onkeydown=(ev)=>{if(ev.key==="Enter")login()};
      u.focus();
    }

    window.showSplash = showSplash;
    showSplash("Sign in to continue.");
  })();
  </script>
</body>
</html>
