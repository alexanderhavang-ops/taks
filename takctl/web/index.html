<!doctype html>
<html lang="en">
<head>
  <base href="/takctl/">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>takctl-web</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <pre id="__crash" style="display:none;white-space:pre-wrap;background:#200;color:#fbb;padding:12px;margin:12px;border-radius:8px;"></pre>
  <script>
    window.addEventListener('error', function(e){
      var el=document.getElementById('__crash');
      el.style.display='block';
      el.textContent = "JS ERROR: " + (e.message||e.type) + "\n" + (e.filename||"") + ":" + (e.lineno||"") + ":" + (e.colno||"");
    });
    window.addEventListener('unhandledrejection', function(e){
      var el=document.getElementById('__crash');
      el.style.display='block';
      el.textContent = "PROMISE REJECTION: " + (e.reason && (e.reason.stack||e.reason.message) || String(e.reason));
    });
  </script>

  <div id="root"></div>


  <!-- App -->
  <script src="./vendor/react.production.min.js"></script>
<script src="./vendor/react-dom.production.min.js"></script>

<script src="./utils/format.js"></script>
<script src="./hooks/useApi.js"></script>

<script src="./components/Users.js"></script>
<script src="./components/Clients.js"></script>
<script src="./components/CRL.js"></script>
<script src="./components/Certs.js"></script>
<script src="./components/Health.js"></script>

<script src="./components/Layout.js"></script>

<script src="./app.js"></script>

</body>
</html>
