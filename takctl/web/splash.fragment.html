<div class="splash">
  <div class="splash-main">

    <!-- TAKS product mark (CSS expects .splash-taks) -->
    <div class="splash-taks">
      <img src="./assets/taks-logo.png" alt="TAKS"
           onerror="this.onerror=null;this.src='./assets/taks-logo.svg'">
    </div>

    <!-- populated by splash.js using /api/public/brand?unit=... -->
    <div class="brandchain">
      <div class="brandchain-row" id="__brand_logos"></div>
    </div>

    <div class="splash-slogan" id="__splash_slogan"></div>

  </div>

  <div class="login-wrap">
    <div class="login">
      <div class="login-form">
        <div class="field">
          <label>Username</label>
          <input id="__u" autocomplete="username" />
        </div>

        <div class="field">
          <label>Role</label>
          <input id="__r" autocomplete="organization-title" placeholder="e.g. operator, admin, battalion-s4" />
        </div>

        <div class="field">
          <label>Password</label>
          <input id="__p" type="password" autocomplete="current-password" />
        </div>

        <div class="actions">
          <button id="__go" type="button">Sign in</button>
        </div>
      </div>

      <div class="login-err" id="__err"></div>
    </div>
  </div>
</div>
