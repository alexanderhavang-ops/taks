[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "takctl"
version = "0.1.0"
description = "TAK control CLI"
requires-python = ">=3.10"
dependencies = [
  "typer>=0.12.0",
  "rich>=13.0.0",
  "psycopg2-binary>=2.9.0",
  "python-multipart",
  "openpyxl",
  "slixmpp>=1.8.0",
]

[project.scripts]
takctl = "takctl.main:entrypoint"

[tool.setuptools]
packages = ["takctl", "takctl.domain", "takctl.services", "takctl.commands", "takctl.infra"]
