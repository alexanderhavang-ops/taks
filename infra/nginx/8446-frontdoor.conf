server {
    access_log /var/log/nginx/enroll-debug.log enroll_dbg;
    error_log  /var/log/nginx/enroll-error.log info;

    listen 8446 ssl;
    server_name __FQDN__;

    ssl_certificate     /etc/letsencrypt/live/__FQDN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__FQDN__/privkey.pem;

    include /etc/nginx/snippets/ssl-common.conf;
    include /etc/nginx/snippets/deny-dotfiles.conf;

    # WebTak/Marti must be frameable (TAK upstream/proxy behavior)
    add_header X-Frame-Options SAMEORIGIN always;

    # TAK upstream uses internal TLS (often self-signed), so don't verify upstream cert
    proxy_ssl_verify off;
    proxy_ssl_server_name on;

    # Root -> /Marti (convenience)
    location = / {
        return 302 /Marti;
    }

    # BORING GLUE: Marti login SPA expects these at root, but TAK serves them under /Marti/
    location ^~ /oauth/ {
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Host  $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port  $server_port;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP         $remote_addr;

        proxy_redirect https://127.0.0.1:8447/ https://$host:$server_port/;
        proxy_pass https://127.0.0.1:8447/oauth/;
        proxy_read_timeout 300s;
    }

    location ^~ /login/ {
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Host  $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port  $server_port;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP         $remote_addr;

        proxy_redirect https://127.0.0.1:8447/ https://$host:$server_port/;
        proxy_pass https://127.0.0.1:8447/login/;
        proxy_read_timeout 300s;
    }

    # BORING: everything else goes to TakServer on 8447, untouched
    location / {
        proxy_http_version 1.1;

        # Websocket support (/takproto)
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Preserve host + port as seen by the client
        proxy_set_header Host              $http_host;
        proxy_set_header X-Forwarded-Host  $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port  $server_port;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP         $remote_addr;

        # Preserve :8446 on upstream absolute redirects (proxy-unaware upstream)
        proxy_redirect https://127.0.0.1:8447/ https://$host:$server_port/;

        # IMPORTANT: no trailing slash => keep original URI
        proxy_pass https://127.0.0.1:8447;

        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
    }
}
