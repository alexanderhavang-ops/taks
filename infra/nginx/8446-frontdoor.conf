server {
    access_log /var/log/nginx/enroll-debug.log enroll_dbg;
    error_log  /var/log/nginx/enroll-error.log info;

    listen 8446 ssl;
    server_name __FQDN__;

    ssl_certificate     /etc/letsencrypt/live/__FQDN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__FQDN__/privkey.pem;

    include /etc/nginx/snippets/ssl-common.conf;
    include /etc/nginx/snippets/deny-dotfiles.conf;

    # Upstream TAK web uses internal TLS (often self-signed)
    proxy_ssl_verify off;
    proxy_ssl_server_name on;

    # ------------------------------------------------------------------
    # BORING MODE:
    # 8446 is a straight reverse-proxy "frontdoor" to TAK web.
    #
    # Key points:
    # - Preserve host *including port* so TAK generates correct redirects.
    # - Rewrite absolute Location headers that drop :8446 (otherwise you
    #   bounce to https://host/... on 443 and hit takctl's 404-only vhost).
    # ------------------------------------------------------------------

    location / {
        proxy_pass https://127.0.0.1:8447;
        proxy_http_version 1.1;

        # Preserve original host INCLUDING port (critical)
        proxy_set_header Host              $http_host;
        proxy_set_header X-Forwarded-Host  $http_host;

        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port  8446;

        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP         $remote_addr;

        proxy_buffering off;

        # Fix absolute redirects that lose :8446
        # Example broken: Location: https://46hvbat.tak-hv-sandbox.se/index.html
        # Rewrite to:     Location: https://46hvbat.tak-hv-sandbox.se:8446/index.html
        proxy_redirect ~^https?://[^/]+(/.*)$ https://$http_host$1;
    }
}

