server {
    access_log /var/log/nginx/enroll-debug.log enroll_dbg;
    error_log  /var/log/nginx/enroll-error.log info;

    listen 8446 ssl;
    server_name __FQDN__;

    ssl_certificate     /etc/letsencrypt/live/__FQDN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__FQDN__/privkey.pem;

    include /etc/nginx/snippets/ssl-common.conf;
    include /etc/nginx/snippets/deny-dotfiles.conf;

    # TAK upstream uses internal TLS (often self-signed), so don't verify upstream cert
    proxy_ssl_verify off;
    proxy_ssl_server_name on;

    # Root -> /Marti
    location = / {
        return 302 /Marti;
    }

    # WebTAK UI
    location /WebTak/ {
        proxy_pass https://127.0.0.1:8447/WebTak/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 8446;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;

        proxy_buffering off;
    }

    # WebTAK OAuth token flow (POST /oauth/token)
    location /oauth/ {
        proxy_pass https://127.0.0.1:8447/oauth/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 8446;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;

        proxy_buffering off;
    }

    # Marti web/API
    location /Marti/ {
        proxy_pass https://127.0.0.1:8447/Marti/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 8446;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;

        proxy_buffering off;
    }
}
