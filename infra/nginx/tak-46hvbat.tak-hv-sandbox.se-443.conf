server {
    listen 443 ssl;
    server_name 46hvbat.tak-hv-sandbox.se;

    # TLS
    ssl_certificate     /etc/letsencrypt/live/46hvbat.tak-hv-sandbox.se/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/46hvbat.tak-hv-sandbox.se/privkey.pem;

    include /etc/nginx/snippets/ssl-common.conf;
    include /etc/nginx/snippets/deny-dotfiles.conf;

    # ------------------------------------------------------------
    # takctl-web (FastAPI + static UI)
    # URL: https://46hvbat.tak-hv-sandbox.se/takctl/
    # Backend: http://127.0.0.1:8080/
    # ------------------------------------------------------------

    location = /takctl {
        return 301 /takctl/;
    }

    location /takctl/ {
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Trailing slash is IMPORTANT
        proxy_pass http://127.0.0.1:8080/;

        proxy_read_timeout  60s;
        proxy_send_timeout  60s;
    }

    # Explicitly deny everything else
    location / {
        return 404;
    }
}
