# Installer-owned log formats used by TAK nginx vhosts
# NOTE: do not duplicate names elsewhere (nginx.conf, other conf.d files)

log_format enroll_dbg '$remote_addr - $remote_user [$time_local] '
                      '"$request" $status $body_bytes_sent '
                      '"$http_referer" "$http_user_agent" '
                      'rt=$request_time '
                      'uct=$upstream_connect_time uht=$upstream_header_time urt=$upstream_response_time';

# --- node_auth (orchestrator node auth presence debugging) ---
# Logs only whether Authorization header is present and whether it is Basic.
# Does NOT log header value.
map $http_authorization $auth_scheme {
  default "none";
  "~^Basic" "basic";
}

log_format node_auth '$remote_addr $time_iso8601 "$request" '
                    'status=$status auth=$auth_scheme ua="$http_user_agent"';
# --- end node_auth ---
