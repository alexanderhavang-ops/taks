[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "martine"
version = "0.1.0"
description = "Martine CoT chat agent with MCP-backed tools"
requires-python = ">=3.11"
dependencies = ["openai-agents==0.24.0"]

[tool.setuptools]
packages = ["martine"]
